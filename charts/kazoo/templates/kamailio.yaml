{{- if .Values.kamailio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kazoo.fullname" . }}-kamailio
  labels:
    {{- include "kazoo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.kamailio.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kazoo.selectorLabels" . | nindent 6 }}
      component: kamailio
  template:
    metadata:
      labels:
        {{- include "kazoo.selectorLabels" . | nindent 8 }}
        component: kamailio
        app: {{ include "kazoo.name" . }}
    spec:
      {{- include "kazoo.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}-kamailio
          image: {{ include "kazoo.image" (dict "ctx" . "name" "kamailio") }}
          imagePullPolicy: {{ include "kazoo.imagePullPolicy" . }}
          resources:
            {{- toYaml .Values.kamailio.resources | nindent 12 }}
          env:
            - name: DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: masterRealm
            - name: ADVERTISE_IP
              value: {{ .Values.kamailio.advertiseIP | quote }}
            {{- if .Values.kamailio.registrarPath }}
            - name: KAMAILIO_REGISTRAR_PATH
              value: {{ .Values.kamailio.registrarPath | quote }}
            {{- end }}
            - name: RABBIT_HOST
              value: {{ include "kazoo.service" (dict "ctx" . "name" "rabbitmq") }}
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: rabbitUser
            - name: RABBIT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: rabbitPass
            - name: PG_HOST
              value: {{ include "kazoo.service" (dict "ctx" . "name" "postgres") }}
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: postgresUser
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: postgresPass
            - name: PG_DB
              value: kamailio
            # Always the headless subdomain FQDN (freeswitch.<subdomain>), which
            # resolves straight to the pod IP -- not the regular freeswitch
            # Service name/ClusterIP, and not the WAN/ext-sip-ip advertise
            # address. A ClusterIP here previously leaked into the SDP
            # FreeSWITCH hands back to the external caller ("call connects, no
            # audio" -- see AGENTS.md "Solved issues" #9); the WAN address
            # only works via hairpin NAT and conflates "how kamailio reaches
            # FreeSWITCH" with "what FreeSWITCH advertises externally" (a
            # separate, Kazoo application-level concern).
            - name: FREESWITCH_SIP_ADDRESS
              value: {{ printf "freeswitch.%s:%d" .Values.subdomain (int .Values.freeswitch.sipPort) }}
            - name: KAMAILIO_SHM_MEMORY
              value: {{ .Values.kamailio.shmMemory | quote }}
            - name: KAMAILIO_PKG_MEMORY
              value: {{ .Values.kamailio.pkgMemory | quote }}
            - name: KAMAILIO_CHILDREN
              value: {{ .Values.kamailio.children | quote }}
            - name: KAMAILIO_TCP_CHILDREN
              value: {{ .Values.kamailio.tcpChildren | quote }}
            - name: KAMAILIO_REGISTRAR_QUERY_TIMEOUT_MS
              value: {{ .Values.kamailio.registrarQueryTimeoutMs | quote }}
          {{- include "kazoo.containerPorts" .Values.kamailio.service.ports | nindent 10 }}
          {{- if .Values.hepCapture.enabled }}
          volumeMounts:
            - name: hep-config
              mountPath: /etc/heplify
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: 5060
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 5060
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 9
        {{- if .Values.hepCapture.enabled }}
        - name: heplify
          image: {{ .Values.hepCapture.image }}
          imagePullPolicy: {{ include "kazoo.imagePullPolicy" . }}
          env:
            - name: HEPLIFY_CONFIG
              value: /etc/heplify/heplify.json
          volumeMounts:
            - name: hep-config
              mountPath: /etc/heplify
          securityContext:
            capabilities:
              add: [NET_RAW, NET_ADMIN]
        {{- end }}
      {{- if .Values.hepCapture.enabled }}
      volumes:
        - name: hep-config
          configMap:
            name: {{ include "kazoo.fullname" . }}-kamailio-hep
      {{- end }}
{{- end }}
