# Per-component Services. couchdb/rabbitmq/postgres/kazooCore/kamailio/
# monsterUi all share one shape -- a plain `service.ports` list -- so
# they're all rendered by the "kazoo.simpleService" helper in _helpers.tpl:
# type, annotations/labels (LB pool selection, ip pinning, cert annotations,
# ...), and spec extras (externalTrafficPolicy, loadBalancerIP,
# loadBalancerSourceRanges) all pass straight through from
# <component>.service.* the way most charts do. FreeSWITCH is the exception
# (its RTP range is generated, not listed) and keeps its own explicit block
# at the end.

{{- if and .Values.couchdb.enabled .Values.couchdb.service.enabled }}
{{ include "kazoo.simpleService" (dict "ctx" . "name" "couchdb" "component" "couchdb") }}
{{- end }}

{{- if and .Values.rabbitmq.enabled .Values.rabbitmq.service.enabled }}
---
{{ include "kazoo.simpleService" (dict "ctx" . "name" "rabbitmq" "component" "rabbitmq") }}
{{- end }}

{{- if and .Values.postgres.enabled .Values.postgres.service.enabled }}
---
{{ include "kazoo.simpleService" (dict "ctx" . "name" "postgres" "component" "postgres") }}
{{- end }}

---
# Crossbar HTTP API (kazoo-apps) -- the browser-facing REST endpoint. This is
# kazooCore's outbound service: type "none" means no Service at all (port-
# forward instead, see NOTES.txt).
{{- if and .Values.kazooCore.enabled .Values.kazooCore.service.enabled (ne .Values.kazooCore.service.type "none") }}
{{ include "kazoo.simpleService" (dict "ctx" . "name" "kazooCore" "component" "kazoo-apps") }}
{{- end }}

{{- if and .Values.monsterUi.enabled .Values.monsterUi.service.enabled (ne .Values.monsterUi.service.type "none") }}
---
{{ include "kazoo.simpleService" (dict "ctx" . "name" "monsterUi" "component" "monster-ui") }}
{{- end }}

---
# Kamailio SIP -- type is whatever kamailio.service.type says (ClusterIP by
# default); set NodePort/LoadBalancer to expose SIP to phones. LB pool/ip
# selection (e.g. Cilium LB-IPAM) goes in kamailio.service.labels/annotations.
{{- if and .Values.kamailio.enabled .Values.kamailio.service.enabled }}
{{ include "kazoo.simpleService" (dict "ctx" . "name" "kamailio" "component" "kamailio") }}
{{- end }}

---
# FreeSWITCH SIP + Erlang dist. `<freeswitch service name>` resolves in-cluster
# for the kamailio dispatcher ("sip:freeswitch:11000"); ecallmgr reaches the
# switch via the subdomain "freeswitch.kazoo" (headless) -> pod IP:8031 directly.
# To expose SIP + RTP to phones, set freeswitch.service.type=LoadBalancer and
# freeswitch.service.includeRtp=true (appends the RTP slice below). Ports here
# are computed from scalars (sipPort/erlangDistPort/rtp range), not a flat
# `service.ports` list -- see values.yaml's freeswitch section for why.
{{- if and .Values.freeswitch.enabled .Values.freeswitch.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kazoo.service" (dict "ctx" . "name" "freeswitch") }}
  labels:
    {{- include "kazoo.labels" . | nindent 4 }}
    {{- if .Values.freeswitch.service.labels }}
    {{- toYaml .Values.freeswitch.service.labels | nindent 4 }}
    {{- end }}
  {{- if .Values.freeswitch.service.annotations }}
  annotations:
    {{- toYaml .Values.freeswitch.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.freeswitch.service.type }}
  {{- if .Values.freeswitch.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.freeswitch.service.externalTrafficPolicy }}
  {{- end }}
  {{- if .Values.freeswitch.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.freeswitch.service.loadBalancerIP }}
  {{- end }}
  {{- if .Values.freeswitch.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.freeswitch.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector:
    {{- include "kazoo.selectorLabels" . | nindent 4 }}
    component: freeswitch
  ports:
    - name: sip-udp
      port: {{ .Values.freeswitch.sipPort }}
      protocol: UDP
    - name: sip-tcp
      port: {{ .Values.freeswitch.sipPort }}
      protocol: TCP
    - name: erlang-dist
      port: {{ .Values.freeswitch.erlangDistPort }}
      protocol: TCP
    - name: epmd
      port: 4369
      protocol: TCP
    {{- if .Values.freeswitch.service.includeRtp }}
    {{- $rtpStart := int .Values.freeswitch.rtpStartPort }}
    {{- $rtpEnd := int .Values.freeswitch.rtpEndPort }}
    {{- $rtpCount := add (sub $rtpEnd $rtpStart) 1 | toString | int }}
    {{- range $i, $_ := until $rtpCount }}
    - name: rtp-{{ add $rtpStart $i }}
      port: {{ add $rtpStart $i }}
      protocol: UDP
    {{- end }}
    {{- end }}
{{- end }}
