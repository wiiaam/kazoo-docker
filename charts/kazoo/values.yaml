# Kazoo Classic 4.3 Helm chart -- default values.
#
# The chart mirrors compose.yaml 1:1: same services, same env vars the
# images' entrypoints already render. See NOTES.txt after `helm install`.
# Structure follows the kube-prometheus-stack conventions: one section per
# component, each carrying its own enabled / image / service / storage knobs.

## Provide a name in place of "kazoo" for `app:` labels
##
nameOverride: ""

## Provide a name to substitute for the full names of resources
##
fullnameOverride: ""

##
global:
  ## Global image registry. When set (non-empty) it is prepended to EVERY
  ## image (incl. the official Docker Hub data-plane images). Leave empty to
  ## use each component's own `registry` default.
  ##
  imageRegistry: ""
  ## Set the pull policy for every kazoo/data-plane container image.
  ##
  imagePullPolicy: IfNotPresent

  ## Reference to one or more secrets to be used when pulling images
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ##
  imagePullSecrets: []
  # - name: "image-pull-secret"

# ---------------------------------------------------------------------------
# Shared credentials/secret domain. Change-me defaults keep `helm template`
# renderable; set real values on install.
# ---------------------------------------------------------------------------
secrets:
  erlangCookie: change_me_cookie
  rabbitUser: kazoo
  rabbitPass: change_me_rabbit
  couchUser: admin
  couchPass: change_me_couch
  couchSecret: change_me_couch_secret
  postgresUser: kamailio
  postgresPass: change_me_pg
  masterAccountName: Master Account
  masterRealm: sip.example.local
  masterUser: administrator
  masterPass: change_me_master

## Outbound DNS for the data plane / shared volume/ports section follows.
## NetworkPolicy: this cluster is default-deny across all pods, so we ship a
## namespace-wide permissive CiliumNetworkPolicy. `ciliumDefaultAllow: true`
## renders it (allows same-namespace + the ingress gateway + -- when
## `allowWorldIngress` is also true -- `world`, which LoadBalancer-exposed SIP
## and RTP need). Set false on clusters without per-namespace default-deny.
networkPolicies:
  ciliumDefaultAllow: false
  traefikNamespace: traefik
  allowWorldIngress: true

# ---------------------------------------------------------------------------
# Subdomain DNS: pods get hostname.* + setHostnameAsFQDN behind a headless
# Service so `hostname -f` is dotted (Erlang long-name requirement) and
# "<svc>.kazoo" resolves from other pods (mirrors compose hostnames).
# ---------------------------------------------------------------------------
subdomain: kazoo

# ---------------------------------------------------------------------------
# Shared Monster-UI app-metadata volume (ReadWriteMany). kazoo-apps registers
# the apps with Crossbar once monster-ui copies them here.
# ---------------------------------------------------------------------------
shared:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteMany
  size: 1Gi

# ---------------------------------------------------------------------------
# CouchDB (official Docker Hub image).
# ref: https://hub.docker.com/_/couchdb
# ---------------------------------------------------------------------------
couchdb:
  enabled: true
  image: couchdb:3.2.3
  service:
    enabled: true
    type: ClusterIP
    ## Service name -- also the in-cluster DNS name kazoo uses as its Couch
    ## host. Set a custom one if you run several stacks in one namespace.
    name: couchdb
    port: 5984
    ## Extra labels/annotations + Service spec passthrough (maps 1:1 onto the
    ## Service resource). Repeated on every component -- see kamailio for docs.
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
  storage:
    storageClass: ""
    size: 10Gi

# ---------------------------------------------------------------------------
# RabbitMQ (official Docker Hub image). Single node, shared vhost "/".
# ---------------------------------------------------------------------------
rabbitmq:
  enabled: true
  image: rabbitmq:3.13.7-management
  service:
    enabled: true
    type: ClusterIP
    name: rabbitmq
    port: 5672
    mgmtPort: 15672
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
  storage:
    storageClass: ""
    size: 2Gi

# ---------------------------------------------------------------------------
# PostgreSQL (official Docker Hub image) -- kamailio's location/subscriber DB.
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  image: postgres:13
  maxConnections: 1000
  service:
    enabled: true
    type: ClusterIP
    name: postgres
    port: 5432
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
  storage:
    storageClass: ""
    size: 5Gi

# ---------------------------------------------------------------------------
# Kazoo core image -- two roles from the same image, selected by KAZOO_NODE:
#   kazoo-apps (Crossbar REST API, runs kazoo-init.sh bootstrap)
#   ecallmgr   (media controller, owns the FreeSWITCH connection)
# Service here is the Crossbar API endpoint served by the kazoo-apps pod.
# ---------------------------------------------------------------------------
kazooCore:
  enabled: true
  image: ghcr.io/wiiaam/kazoo-core:latest
  replicaCount: 1
  ## Crossbar API external access via a Gateway API HTTPRoute (optional).
  ## Requires the Gateway API CRDs (gateway.networking.k8s.io/v1); TLS
  ## terminates on the Gateway, not on the HTTPRoute itself. When enabled and
  ## hostname is set, the Monster-UI Crossbar base is derived from it
  ## (<scheme per tls>://<hostname>/v2) unless monsterUi.crossbarApiUrl is
  ## pinned explicitly.
  httpRoute:
    enabled: false
    ## External hostname. Empty = route applies to any Gateway listener host.
    hostname: ""
    ## Parent Gateway the route attaches to (parentRefs).
    gateway:
      name: kazoo
      ## Empty = same namespace as the release.
      namespace: ""
    ## Scheme used when deriving the Crossbar API base (https when the
    ## Gateway terminates TLS for this host).
    tls: false
    ## Extra HTTPRoute rules appended after the default backendRef rule --
    ## full rule specs (matches/filters/backendRefs) for things like path
    ## filtering or URL rewrites. Most-specific match wins over the default.
    rules: []
  service:
    enabled: true
    type: ClusterIP   # ClusterIP | NodePort | none (none = port-forward only)
    name: crossbar
    port: 8000
    targetPort: 8000
    nodePort: ""
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

# ---------------------------------------------------------------------------
# Kamailio -- SIP edge/proxy. Registration + location live in its PostgreSQL.
# ---------------------------------------------------------------------------
kamailio:
  enabled: true
  image: ghcr.io/wiiaam/kazoo-kamailio:latest
  replicaCount: 1
  ## Address kamailio advertises in Via/Contact/Record-Route -- what phones
  ## actually send packets back to. Phones must reach it exactly at
  ## advertiseIP:5060. In LoadBalancer mode set this to the LB DNS name
  ## (e.g. sip.example.com) or IP; in hostPort mode to the node's LAN IP.
  ## Empty -> entrypoint picks pod IP (in-cluster only).
  advertiseIP: ""
  ## Address kamailio announces as the registration "Proxy-Path" (what ecallmgr
  ## uses to route the callee leg back through kamailio when FreeSWITCH dials a
  ## registered device). Must be reachable FROM FreeSWITCH; defaults to
  ## advertiseIP. With a LoadBalancer in front (advertiseIP = public/DNS name
  ## that the cluster's resolver may not honor) set this to the kamailio LB IP
  ## so the terminating leg is deterministic: e.g. "192.168.10.129".
  registrarPath: ""
  ## Pod-level hostPort for single-node labs (SIP 5060 straight on the node,
  ## keep advertiseIP = node LAN IP). For a real deployment use the Service
  ## below (type: LoadBalancer) and leave type: none here.
  external:
    type: hostPort   # hostPort | none
    hostPort: 5060
  ## Shared memory / pkg memory for the kamailio process
  shmMemory: 256
  pkgMemory: 16
  ## SIP Service. Ports are fixed (5060/5061/7000); type is generic -- expose
  ## to phones with `type: LoadBalancer` (+ labels/annotations for the LB pool
  ## / IP). The advertised port always equals 5060, so `advertiseIP` must
  ## resolve exactly to the LB service on :5060.
  service:
    enabled: true
    type: ClusterIP   # ClusterIP | NodePort | LoadBalancer
    name: kamailio
    udp: 5060
    tcp: 5060
    tls: 5061
    ws: 7000
    ## Extra labels/annotations + Service spec passthrough (LB pool selection,
    ## loadBalancerIP/IP pinning, externalTrafficPolicy, ...) -- maps 1:1 onto
    ## the Service resource.
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    nodePort: ""

# ---------------------------------------------------------------------------
# FreeSWITCH + mod_kazoo. SIP + RTP reachable from outside the cluster via the
# LoadBalancer Service or (single-node labs) hostPort/hostNetwork.
# ---------------------------------------------------------------------------
freeswitch:
  enabled: true
  image: ghcr.io/wiiaam/kazoo-freeswitch:latest
  replicaCount: 1
  ## Range published / bound for RTP media.
  rtpStartPort: 16384
  rtpEndPort: 16512
  ## SIP + Erlang dist ports (also the in-cluster service ports below).
  sipPort: 11000
  erlangDistPort: 8031
  ## IP advertised to phones for SIP signaling (KAZOO_LOCAL_ADDRESS -> ext-sip)
  ## and RTP (EXT_RTP_IP). For LoadBalancer exposure set publicIP to the LB DNS
  ## name (e.g. sip.example.com) so phones get the right Contact/SDP address.
  ## Empty -> falls back to the pod IP (in-cluster only). The *local* SIP bind
  ## (sip-ip, KAZOO_ADDRESS) is ALWAYS a bindable local address: the pod IP via
  ## the downward API, or `localIP` below to force a specific/single-host bind.
  publicIP: ""
  extRtpIP: ""
  ## Force the local SIP bind address (sip-ip / KAZOO_ADDRESS) instead of the
  ## pod's own IP (status.podIP). Only useful with hostPort/hostNetwork single-
  ## node labs or a fixed container IP; leave empty otherwise.
  localIP: ""
  ## Pod-level network knobs for single-node labs. Leave type: none and use the
  ## Service below (type: LoadBalancer) for real deployments.
  external:
    type: none        # hostNetwork | hostPort | none
    hostPortSip: 11000
  ## Erlang dist long name + what ecallmgr is seeded to ping. Default keeps
  ## the classic compose identity; "<node>.kazoo" resolves via subdomain DNS.
  nodeName: freeswitch@freeswitch.kazoo
  ## FreeSWITCH Service. It already carries SIP 11000 + Erlang dist (8031, for
  ## ecallmgr) in-cluster. `includeRtp: true` appends the RTP slice
  ## (16384-16512) -- set that with type: LoadBalancer to expose media for WAN
  ## DNAT. labels/annotations/spec extras pass through to the Service.
  service:
    enabled: true
    type: ClusterIP   # ClusterIP | LoadBalancer
    name: freeswitch
    includeRtp: false
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
  storage:
    storageClass: ""
    dataSize: 2Gi
    logSize: 1Gi

# ---------------------------------------------------------------------------
# Monster-UI -- static SPA served by nginx; a pure Crossbar REST client.
# ---------------------------------------------------------------------------
monsterUi:
  enabled: true
  image: ghcr.io/wiiaam/kazoo-monster-ui:latest
  replicaCount: 1
  whitelabelName: Kazoo
  applicationTitle: Kazoo Classic
  ## Overrides the browser-default http://<browser-host>:8000/v2/ in js/config.js.
  ## Only needed when Crossbar is proxied behind an LB.
  apiUrl: ""
  ## Browser-reachable Crossbar base baked into each Monster-UI app registry
  ## entry (kazoo-init init_apps). When empty it is derived automatically:
  ##   * kazooCore.httpRoute enabled + hostname set ->
  ##     <scheme per kazooCore.httpRoute.tls>://<hostname>/v2
  ##   * otherwise -> http://localhost:8000/v2
  ## Set explicitly to pin a value (e.g. your own LB) regardless of httpRoute.
  crossbarApiUrl: ""
  ## Monster-UI external access via a Gateway API HTTPRoute (optional).
  ## Requires the Gateway API CRDs; TLS terminates on the Gateway.
  httpRoute:
    enabled: false
    ## External hostname. Empty = route applies to any Gateway listener host.
    hostname: ""
    ## Parent Gateway the route attaches to (parentRefs).
    gateway:
      name: kazoo
      ## Empty = same namespace as the release.
      namespace: ""
    ## True when the Gateway terminates TLS for this host (only affects the
    ## scheme of browser links the Gateway rewrites; no TLS config here).
    tls: false
    ## Extra HTTPRoute rules appended after the default backendRef rule --
    ## full rule specs (matches/filters/backendRefs). Most-specific match wins.
    rules: []
  service:
    enabled: true
    type: ClusterIP   # ClusterIP | NodePort | none
    name: monster-ui
    port: 8080
    targetPort: 80
    nodePort: ""
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []