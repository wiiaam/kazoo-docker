apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-db-init
data:
  init-user-db.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE DATABASE homer_config;
    EOSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homer-db
  labels:
    app: homer-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homer-db
  template:
    metadata:
      labels:
        app: homer-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1
      containers:
        - name: postgres
          image: postgres:11-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: root
            - name: POSTGRES_PASSWORD
              value: homerSeven
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U root"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: homer-db-data
        - name: init
          configMap:
            name: homer-db-init
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homer-db-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-2-replica
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: homer-db
  labels:
    app: homer-db
spec:
  selector:
    app: homer-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP