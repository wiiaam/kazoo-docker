{{- if .Values.kazooCore.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kazoo.fullname" . }}-kazoo-apps
  labels:
    {{- include "kazoo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.kazooCore.replicaCount }}
  selector:
    matchLabels:
      {{- include "kazoo.selectorLabels" . | nindent 6 }}
      component: kazoo-apps
  template:
    metadata:
      labels:
        {{- include "kazoo.selectorLabels" . | nindent 8 }}
        component: kazoo-apps
    spec:
      {{- include "kazoo.imagePullSecrets" . | nindent 6 }}
      hostname: kazoo-apps
      subdomain: {{ .Values.subdomain }}
      setHostnameAsFQDN: true
      containers:
        - name: {{ .Chart.Name }}-apps
          image: {{ include "kazoo.image" (dict "ctx" . "name" "kazooCore") }}
          imagePullPolicy: {{ include "kazoo.imagePullPolicy" . }}
          env:
            - name: KAZOO_NODE
              value: kazoo_apps
            - name: ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: erlangCookie
            - name: RABBIT_HOST
              value: {{ include "kazoo.service" (dict "ctx" . "name" "rabbitmq") }}
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: rabbitUser
            - name: RABBIT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: rabbitPass
            - name: COUCH_HOST
              value: {{ include "kazoo.service" (dict "ctx" . "name" "couchdb") }}
            - name: COUCH_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: couchUser
            - name: COUCH_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: couchPass
            # Bootstrap provisioning (background + sup + kazoo-init.sh)
            - name: KAZOO_BOOTSTRAP
              value: /kazoo-init.sh
            - name: MASTER_ACCOUNT_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: masterAccountName
            - name: MASTER_REALM
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: masterRealm
            - name: MASTER_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: masterUser
            - name: MASTER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "kazoo.secret.name" . }}
                  key: masterPass
            # Browser-reachable Crossbar base baked into Monster-UI app registry
            # (explicit monsterUi.crossbarApiUrl, else derived from the
            # kazooApps HTTPRoute host, else localhost fallback)
            - name: CROSSBAR_API_URL
              value: {{ include "kazoo.crossbarApiUrl" . | quote }}
            # ecallmgr "fs_nodes" seed -- must equal the FS pod node name
            - name: FS_NODE_NAME
              value: {{ .Values.freeswitch.nodeName | quote }}
          {{- include "kazoo.containerPorts" .Values.kazooCore.service.ports | nindent 10 }}
          readinessProbe:
            exec:
              command: ["/opt/kazoo/bin/sup", "-n", "kazoo_apps", "kz_nodes", "status"]
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: {{ include "kazoo.fullname" . }}-shared
{{- end }}
