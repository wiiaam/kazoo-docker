name: build-kazoo-helm

# Package + publish the helm chart as an OCI artifact to
# ghcr.io/<repo>/kazoo:<chart-version> whenever anything under charts/ changes.
# On pull requests it only builds + lints (no push).

on:
  push:
    paths:
      - 'charts/**'
  pull_request:
    paths:
      - 'charts/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/kazoo

      - name: Package chart
        run: helm package charts/kazoo -d /tmp/helm-dist

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name != 'pull_request'

      - name: Publish to GHCR (OCI)
        run: helm push /tmp/helm-dist/kazoo-*.tgz oci://ghcr.io/${{ github.repository }}
        if: github.event_name != 'pull_request'