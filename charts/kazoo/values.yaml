# Kazoo Classic 4.3 Helm chart -- default values.
#
# The chart mirrors compose.yaml 1:1: same services, same env vars the
# images' entrypoints already render. See NOTES.txt after `helm install`.
# Structure follows the kube-prometheus-stack conventions: one section per
# component, each carrying its own enabled / image / service / storage knobs.
#
# Service ports: every component below (except freeswitch, whose ports are
# partly generated -- see its own section) declares `service.ports` as a
# plain list of Kubernetes ServicePort objects (name/port/targetPort/
# protocol/nodePort), rendered by one shared template that drives both the
# Service and the pod's own containerPort list from the same list, so the two
# can never drift apart. targetPort defaults to port and protocol defaults to
# TCP when omitted, same as the Kubernetes API itself.

## Provide a name in place of "kazoo" for `app:` labels
##
nameOverride: ""

## Provide a name to substitute for the full names of resources
##
fullnameOverride: ""

##
global:
  ## Global image registry. When set (non-empty) it is prepended to EVERY
  ## image (incl. the official Docker Hub data-plane images). Leave empty to
  ## use each component's own `registry` default.
  ##
  imageRegistry: ""
  ## Set the pull policy for every kazoo/data-plane container image.
  ##
  imagePullPolicy: IfNotPresent

  ## Reference to one or more secrets to be used when pulling images
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ##
  imagePullSecrets: []
  # - name: "image-pull-secret"

# ---------------------------------------------------------------------------
# Shared credentials/secret domain. Change-me defaults keep `helm template`
# renderable; set real values on install.
#
# existingSecret: point at a pre-created Secret with the same keys as the
# ones below (see templates/secrets.yaml) instead of templating one from the
# plain values here -- keeps real credentials out of `helm install --set` /
# `helm get values`. When set, every other key in this block is ignored.
# ---------------------------------------------------------------------------
secrets:
  existingSecret: ""
  erlangCookie: change_me_cookie
  rabbitUser: kazoo
  rabbitPass: change_me_rabbit
  couchUser: admin
  couchPass: change_me_couch
  couchSecret: change_me_couch_secret
  postgresUser: kamailio
  postgresPass: change_me_pg
  masterAccountName: Master Account
  masterRealm: sip.example.local
  masterUser: administrator
  masterPass: change_me_master

# ---------------------------------------------------------------------------
# Subdomain DNS: pods get hostname.* + setHostnameAsFQDN behind a headless
# Service so `hostname -f` is dotted (Erlang long-name requirement) and
# "<svc>.kazoo" resolves from other pods (mirrors compose hostnames).
# ---------------------------------------------------------------------------
subdomain: kazoo

# ---------------------------------------------------------------------------
# HEP capture via heplify sidecars. When enabled, a heplify agent is added to
# the kamailio + freeswitch pods (same netns) and forwards SIP (and, on
# FreeSWITCH, RTCP/RTP metadata) to a HEP collector -- e.g. the HOMER stack
# (homer/kustomization.yaml, deployed into the kazoo namespace). `server` is the
# collector's in-cluster DNS name (heplify-server Service in the same ns).
# ---------------------------------------------------------------------------
hepCapture:
  enabled: false
  image: sipcapture/heplify:2.0.27
  server: heplify-server

# ---------------------------------------------------------------------------
# Shared Monster-UI app-metadata volume (ReadWriteMany). kazoo-apps registers
# the apps with Crossbar once monster-ui copies them here.
# ---------------------------------------------------------------------------
shared:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteMany
  size: 1Gi

# ---------------------------------------------------------------------------
# CouchDB (official Docker Hub image).
# ref: https://hub.docker.com/_/couchdb
# ---------------------------------------------------------------------------
couchdb:
  enabled: true
  image: couchdb:3.2.3
  ## Pod resource requests/limits (map 1:1 onto the container's `resources:`).
  ## Empty by default -- this chart ships no opinionated defaults; set these
  ## before running anything beyond a lab install.
  resources: {}
  service:
    enabled: true
    type: ClusterIP
    ## Service name -- also the in-cluster DNS name kazoo uses as its Couch
    ## host. Set a custom one if you run several stacks in one namespace.
    name: couchdb
    ports:
      - name: http
        port: 5984
        targetPort: 5984
    ## Extra labels/annotations + Service spec passthrough (maps 1:1 onto the
    ## Service resource). Repeated on every component -- see kamailio for docs.
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
  storage:
    storageClass: ""
    size: 10Gi

# ---------------------------------------------------------------------------
# RabbitMQ (official Docker Hub image). Single node, shared vhost "/".
# ---------------------------------------------------------------------------
rabbitmq:
  enabled: true
  image: rabbitmq:3.13.7-management
  resources: {}
  service:
    enabled: true
    type: ClusterIP
    name: rabbitmq
    ports:
      - name: amqp
        port: 5672
        targetPort: 5672
      - name: management
        port: 15672
        targetPort: 15672
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
  storage:
    storageClass: ""
    size: 2Gi

# ---------------------------------------------------------------------------
# PostgreSQL (official Docker Hub image) -- kamailio's location/subscriber DB.
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  image: postgres:13
  ## Each connection carries real shared-memory overhead; kamailio's own DB
  ## connection pool is the only real consumer here, so this is generous
  ## headroom rather than sized for 1000 real concurrent connections.
  maxConnections: 200
  resources: {}
  service:
    enabled: true
    type: ClusterIP
    name: postgres
    ports:
      - name: postgres
        port: 5432
        targetPort: 5432
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
  storage:
    storageClass: ""
    size: 5Gi

# ---------------------------------------------------------------------------
# Kazoo core image -- two roles from the same image, selected by KAZOO_NODE:
#   kazoo-apps (Crossbar REST API, runs kazoo-init.sh bootstrap)
#   ecallmgr   (media controller, owns the FreeSWITCH connection)
# Service here is the Crossbar API endpoint served by the kazoo-apps pod.
# `resources` applies to both the kazoo-apps and ecallmgr containers.
# ---------------------------------------------------------------------------
kazooCore:
  enabled: true
  image: ghcr.io/wiiaam/kazoo-core:latest
  replicaCount: 1
  resources: {}
  ## Crossbar API external access via a Gateway API HTTPRoute (optional).
  ## Requires the Gateway API CRDs (gateway.networking.k8s.io/v1); TLS
  ## terminates on the Gateway, not on the HTTPRoute itself. When enabled and
  ## hostname is set, the Monster-UI Crossbar base is derived from it
  ## (<scheme per tls>://<hostname>/v2) unless monsterUi.crossbarApiUrl is
  ## pinned explicitly.
  httpRoute:
    enabled: false
    ## External hostname. Empty = route applies to any Gateway listener host.
    hostname: ""
    ## Parent Gateway the route attaches to (parentRefs).
    gateway:
      name: kazoo
      ## Empty = same namespace as the release.
      namespace: ""
    ## Scheme used when deriving the Crossbar API base (https when the
    ## Gateway terminates TLS for this host).
    tls: false
    ## Extra HTTPRoute rules appended after the default backendRef rule --
    ## full rule specs (matches/filters/backendRefs) for things like path
    ## filtering or URL rewrites. Most-specific match wins over the default.
    rules: []
  service:
    enabled: true
    type: ClusterIP   # ClusterIP | NodePort | none (none = port-forward only)
    name: crossbar
    ports:
      - name: crossbar
        port: 8000
        targetPort: 8000
        nodePort: ""
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

# ---------------------------------------------------------------------------
# Kamailio -- SIP edge/proxy. Registration + location live in its PostgreSQL.
# ---------------------------------------------------------------------------
kamailio:
  enabled: true
  image: ghcr.io/wiiaam/kazoo-kamailio:latest
  replicaCount: 1
  resources: {}
  ## Address kamailio advertises in Via/Contact/Record-Route -- what phones
  ## actually send packets back to. Phones must reach it exactly at
  ## advertiseIP:5060. Set this to the LoadBalancer's DNS name (e.g.
  ## sip.example.com) or IP. Empty -> entrypoint picks pod IP (in-cluster
  ## only).
  advertiseIP: ""
  ## Address kamailio announces as the registration "Proxy-Path" (what ecallmgr
  ## uses to route the callee leg back through kamailio when FreeSWITCH dials a
  ## registered device). Must be reachable FROM FreeSWITCH; defaults to
  ## advertiseIP. With a LoadBalancer in front (advertiseIP = public/DNS name
  ## that the cluster's resolver may not honor) set this to the kamailio LB IP
  ## so the terminating leg is deterministic: e.g. "192.168.10.129".
  registrarPath: ""
  ## Shared memory / pkg memory for the kamailio process
  shmMemory: 256
  pkgMemory: 16
  ## SIP Service. `ports` is a plain list of Kubernetes ServicePort objects --
  ## also what the pod's own containerPort list is rendered from, so the two
  ## can never drift. Names/ports are fixed by the kamailio config tree
  ## (dispatcher/advertise all assume 5060/5061/7000); the advertised port
  ## always equals 5060, so `advertiseIP` must resolve exactly to the LB
  ## service on :5060. Expose to phones with `type: LoadBalancer` (+ labels/
  ## annotations for the LB pool / IP). `nodePort` only takes effect with
  ## `type: NodePort`.
  service:
    enabled: true
    type: ClusterIP   # ClusterIP | NodePort | LoadBalancer
    name: kamailio
    ports:
      - name: sip-udp
        port: 5060
        targetPort: 5060
        protocol: UDP
        nodePort: ""
      - name: sip-tcp
        port: 5060
        targetPort: 5060
        protocol: TCP
        nodePort: ""
      - name: sip-tls-udp
        port: 5061
        targetPort: 5061
        protocol: UDP
      - name: sip-tls-tcp
        port: 5061
        targetPort: 5061
        protocol: TCP
      - name: ws-udp
        port: 7000
        targetPort: 7000
        protocol: UDP
      - name: ws-tcp
        port: 7000
        targetPort: 7000
        protocol: TCP
    ## Extra labels/annotations + Service spec passthrough (LB pool selection,
    ## loadBalancerIP/IP pinning, externalTrafficPolicy, ...) -- maps 1:1 onto
    ## the Service resource.
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

# ---------------------------------------------------------------------------
# FreeSWITCH + mod_kazoo. SIP + RTP reachable from outside the cluster via the
# LoadBalancer Service.
#
# Unlike the other components, FreeSWITCH's ports aren't a flat values list:
# sipPort/erlangDistPort are read directly by several other templates
# (kamailio's FREESWITCH_SIP_ADDRESS, the env vars below, ...) so they stay
# plain scalars here rather than being buried in a ports list, and the RTP
# range is 129 sequential ports generated from rtpStartPort/rtpEndPort -- not
# something you'd hand-list in values either way. Both the Service and the
# pod's containerPort list are built from these same scalars in the template,
# so they can't drift from each other.
# ---------------------------------------------------------------------------
freeswitch:
  enabled: true
  image: ghcr.io/wiiaam/kazoo-freeswitch:latest
  replicaCount: 1
  resources: {}
  ## Range published / bound for RTP media.
  rtpStartPort: 16384
  rtpEndPort: 16512
  ## SIP + Erlang dist ports (also the in-cluster service ports below).
  sipPort: 11000
  erlangDistPort: 8031
  ## IP advertised to phones for SIP signaling (-> KAZOO_LOCAL_ADDRESS ->
  ## ext-sip-ip). Named to match the upstream Kazoo env var -- despite the
  ## "local" in that name, this is the EXTERNALLY-routable address, not a
  ## bind address (that's kazooAddress below). For LoadBalancer exposure set
  ## this to the LB DNS name (e.g. sip.example.com) so phones get the right
  ## Contact/SDP address. Empty -> falls back to the pod IP (in-cluster only).
  kazooLocalAddress: ""
  ## RTP advertise address (-> EXT_RTP_IP -> ext-rtp-ip). Falls back to
  ## kazooLocalAddress automatically (see images/kazoo-freeswitch/
  ## entrypoint.sh) since SIP and RTP normally share the same external path --
  ## only set this separately if yours don't.
  extRtpIP: ""
  ## The actual local SIP bind address (-> KAZOO_ADDRESS -> sip-ip). Almost
  ## always left empty: defaults to the pod's own IP via the downward API.
  ## Only set this to force a specific/fixed bind address.
  kazooAddress: ""
  ## Erlang dist long name + what ecallmgr is seeded to ping. Default keeps
  ## the classic compose identity; "<node>.kazoo" resolves via subdomain DNS.
  nodeName: freeswitch@freeswitch.kazoo
  ## FreeSWITCH Service. It already carries SIP + Erlang dist (for ecallmgr)
  ## in-cluster. `includeRtp: true` appends the RTP slice -- set that with
  ## type: LoadBalancer to expose media for WAN DNAT. labels/annotations/spec
  ## extras pass through to the Service.
  service:
    enabled: true
    type: ClusterIP   # ClusterIP | LoadBalancer
    name: freeswitch
    includeRtp: false
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
  storage:
    storageClass: ""
    dataSize: 2Gi
    logSize: 1Gi

# ---------------------------------------------------------------------------
# Monster-UI -- static SPA served by nginx; a pure Crossbar REST client.
# ---------------------------------------------------------------------------
monsterUi:
  enabled: true
  image: ghcr.io/wiiaam/kazoo-monster-ui:latest
  replicaCount: 1
  resources: {}
  whitelabelName: Kazoo
  applicationTitle: Kazoo Classic
  ## Overrides the browser-default http://<browser-host>:8000/v2/ in js/config.js.
  ## Only needed when Crossbar is proxied behind an LB.
  apiUrl: ""
  ## Browser-reachable Crossbar base baked into each Monster-UI app registry
  ## entry (kazoo-init init_apps). When empty it is derived automatically:
  ##   * kazooCore.httpRoute enabled + hostname set ->
  ##     <scheme per kazooCore.httpRoute.tls>://<hostname>/v2
  ##   * otherwise -> http://localhost:8000/v2
  ## Set explicitly to pin a value (e.g. your own LB) regardless of httpRoute.
  crossbarApiUrl: ""
  ## Monster-UI external access via a Gateway API HTTPRoute (optional).
  ## Requires the Gateway API CRDs; TLS terminates on the Gateway.
  httpRoute:
    enabled: false
    ## External hostname. Empty = route applies to any Gateway listener host.
    hostname: ""
    ## Parent Gateway the route attaches to (parentRefs).
    gateway:
      name: kazoo
      ## Empty = same namespace as the release.
      namespace: ""
    ## True when the Gateway terminates TLS for this host (only affects the
    ## scheme of browser links the Gateway rewrites; no TLS config here).
    tls: false
    ## Extra HTTPRoute rules appended after the default backendRef rule --
    ## full rule specs (matches/filters/backendRefs). Most-specific match wins.
    rules: []
  service:
    enabled: true
    type: ClusterIP   # ClusterIP | NodePort | none
    name: monster-ui
    ports:
      - name: http
        port: 8080
        targetPort: 80
        nodePort: ""
    labels: {}
    annotations: {}
    externalTrafficPolicy: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
