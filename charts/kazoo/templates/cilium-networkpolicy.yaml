# Default-permissive CiliumNetworkPolicy for the whole namespace.
#
# This cluster defaults to deny across all pods, so a tenant namespace needs an
# explicit policy: pods may talk to each other, the ingress gateway (traefik)
# may reach them, and (for LoadBalancer-exposed SIP/RTP services) `world` can
# reach the LB VIPs. egress is intentionally not listed: Cilium only enforces
# egress when egress rules exist, so outbound (incl. cluster DNS) stays free.
# Disable with networkPolicies.ciliumDefaultAllow: false.
{{- if .Values.networkPolicies.ciliumDefaultAllow }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "kazoo.fullname" . }}-default-allow
  labels:
    {{- include "kazoo.labels" . | nindent 4 }}
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicies.traefikNamespace }}
    {{- if .Values.networkPolicies.allowWorldIngress }}
    - fromEntities:
        - world
    {{- end }}
{{- end }}