## FreeSWITCH 1.10.9 modules built from source for Kazoo Classic 4.3.
## Mirrors the module set from the Kazoo install guide / SignalWire 1.10.9 apt.
## NOTE: keep comments to "##" lines. configure's CONF_DISABLED_MODULES grep
## treats any single-# line as a disabled module entry and mangles prose into
## the generated Makefile (bogus rules -> make errors).
## mod_kazoo is built in-tree (event_handlers/mod_kazoo ships in the v1.10.9
## tree), matching SignalWire's freeswitch-mod-kazoo package. The standalone
## freeswitch/mod_kazoo master build corrupts memory (double-free during
## sofia profile start / ACL rebuild); do not go back to it.

