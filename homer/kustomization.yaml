apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# HOMER/sipcapture capture stack. Lives in the kazoo namespace so the heplify
# sidecars can reach heplify-server by its short DNS name, and so the pods are
# co-scheduled on the same node as the kazoo workloads.
namespace: kazoo

resources:
  - postgres.yaml
  - heplify-server.yaml
  - homer-app.yaml