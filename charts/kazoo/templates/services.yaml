# Per-component Services. Each is configured in its owning component's
# `service:` section on purpose -- the values map 1:1 onto a Service spec the
# way most charts do: type, annotations/labels (LB pool selection, ip pinning,
# cert annotations, ...), and spec extras (externalTrafficPolicy,
# loadBalancerIP, loadBalancerSourceRanges) all pass straight through. Names
# come from <component>.service.name (the in-cluster DNS names pods resolve).

{{- if and .Values.couchdb.enabled .Values.couchdb.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kazoo.service" (dict "ctx" . "name" "couchdb") }}
  labels:
    {{- include "kazoo.labels" . | nindent 4 }}
    {{- if .Values.couchdb.service.labels }}
    {{- toYaml .Values.couchdb.service.labels | nindent 4 }}
    {{- end }}
  {{- if .Values.couchdb.service.annotations }}
  annotations:
    {{- toYaml .Values.couchdb.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.couchdb.service.type }}
  {{- if .Values.couchdb.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.couchdb.service.externalTrafficPolicy }}
  {{- end }}
  {{- if .Values.couchdb.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.couchdb.service.loadBalancerIP }}
  {{- end }}
  {{- if .Values.couchdb.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.couchdb.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  selector:
    {{- include "kazoo.selectorLabels" . | nindent 4 }}
    component: couchdb
  ports:
    - name: http
      port: {{ .Values.couchdb.service.port }}
      protocol: TCP
{{- end }}

