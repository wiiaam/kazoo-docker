server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # health check for orchestration
    location = /ping {
        default_type text/plain;
        return 200 "pong\n";
    }

    # SPA entry + hashed routes (monster-ui uses hasher/hashbang routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cacheable static assets
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|otf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # config.js must NOT be cached across tenants/rebuilds
    location = /js/config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}